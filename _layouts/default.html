<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Markdown Viewer" }}</title>
  <style>
    :root[data-theme="light"] {
      --bg: #ffffff;
      --text: #24292e;
      --border: #eaecef;
      --code-bg: #f6f8fa;
      --blockquote: #6a737d;
      --link: #0366d6;
      --btn-bg: #f0f0f0;
      --btn-text: #333;
    }
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --text: #c9d1d9;
      --border: #30363d;
      --code-bg: #161b22;
      --blockquote: #8b949e;
      --link: #58a6ff;
      --btn-bg: #21262d;
      --btn-text: #c9d1d9;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 24px 80px;
      transition: background 0.2s, color 0.2s;
    }
    #theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 14px;
      z-index: 99;
    }
    h1, h2, h3, h4, h5, h6 { font-weight: 600; margin-top: 24px; margin-bottom: 16px; }
    h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 85%;
      font-family: "SFMono-Regular", Consolas, monospace;
    }
    pre {
      background: var(--code-bg);
      padding: 16px;
      border-radius: 6px;
      overflow: auto;
    }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid var(--border); padding: 8px 12px; }
    th { background: var(--code-bg); font-weight: 600; }
    blockquote {
      border-left: 4px solid var(--border);
      margin: 0;
      padding: 0 16px;
      color: var(--blockquote);
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  </style>
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
  {{ content }}
  <script>
    const html = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    const saved = localStorage.getItem('theme') || 'light';
    setTheme(saved);

    function setTheme(t) {
      html.setAttribute('data-theme', t);
      btn.textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark';
      localStorage.setItem('theme', t);
    }
    function toggleTheme() {
      setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
  </script>
</body>
</html>
